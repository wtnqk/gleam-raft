name = "gleam_raft"
version = "0.1.0"
description = "Minimal, feature-complete sans-IO Raft library for Gleam (BEAM and JavaScript)."
gleam = ">= 1.17.0"
licenses = ["MIT"]
repository = { type = "github", user = "wtnqk", repo = "gleam-raft" }

# JS ランタイムは Node.js が唯一のサポート（REQUIREMENTS §7-4。Deno は非サポート）。
[javascript]
runtime = "nodejs"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
